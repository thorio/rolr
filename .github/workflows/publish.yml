name: publish

on:
  push:
    tags: [ 'v*' ]

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: install tools
        run: |
          sudo apt-get install musl-tools gcc-aarch64-linux-gnu -y
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl
          cargo install --debug cargo-make

      - name: build
        run: cargo make ci-ubuntu

      - name: upload artifacts
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: target/artifacts/*

  arch:
    runs-on: ubuntu-22.04
    container:
      image: archlinux
    permissions:
      contents: write
    steps:
      - name: install packages
        run: pacman -Syu base-devel rustup musl git sudo --noconfirm

      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: setup build user
        run: |
          useradd builder -m
          chown -R builder:builder .

      - name: install rust tools
        shell: sudo -u builder bash {0}
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          cargo install --debug cargo-make

      - name: build
        shell: sudo -u builder bash {0}
        run: cargo make ci-arch

      - name: upload artifacts
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: target/artifacts/*
